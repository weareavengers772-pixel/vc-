name: VC+ Security Update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix security false positives
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app.js')
          s = p.read_text()

          old = "function securityTrusted(member, config) { return member?.guild?.ownerId === member?.id || hasGodAccess(member) || config.security.whitelist.includes(member.id); }"
          new = "function securityTrusted(member, config) { return !!member?.user?.bot || member?.guild?.ownerId === member?.id || hasGodAccess(member) || config.security.whitelist.includes(member.id); }"
          if old in s:
              s = s.replace(old, new, 1)

          old = "const entry=logs.entries.first(),executor=entry?.executor;if(!executor||executor.id===guild.ownerId)return;"
          new = "const entry=logs.entries.first(),executor=entry?.executor;if(!executor||executor.id===guild.ownerId||executor.bot||executor.id===client.user?.id)return;"
          if old in s:
              s = s.replace(old, new, 1)

          old = "if(!member||securityTrusted(member,c))return;const count=securityTrack"
          new = "if(!member||member.user?.bot||securityTrusted(member,c))return;const count=securityTrack"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          node --check src/app.js
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'vcplus-bot'
          git config user.email 'actions@github.com'
          if git diff --quiet; then echo 'No changes needed'; exit 0; fi
          git add src/app.js
          git commit -m 'Fix VC creation security false positive'
          git push
